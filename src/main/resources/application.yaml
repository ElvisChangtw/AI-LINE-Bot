line:
  bot:
    channel-token: ${LINE_CHANNEL_TOKEN}
    channel-secret: ${LINE_CHANNEL_SECRET}
    connect-timeout: 5s
    read-timeout: 15s
    handler:
      path: /callback

# 2) Spring AI / OpenAI
spring:
  datasource:
    url: jdbc:sqlite:${BOT_DB_PATH:/data/app.db}?journal_mode=WAL
    hikari:
      maximum-pool-size: 1
  flyway:
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      model:
        audio:
          transcription: openai
      http:
        connect-timeout: 100s
        read-timeout: 120s
      chat:
        options:
          model: ${OPEN_AI_MODEL}
          temperature: ${OPEN_AI_TEMPERATURE}
      image:
        options:
          model: dall-e-3
          size: 1024x1024
          quality: standard
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
bot:
  reply-deadline: 45s
  reply-timeout: 15s
  material-ttl: 7d
  waiting-ttl: 24h
  recent-window: 10m
  self-material-min-chars: 20
  job-lease: 3m
  job-max-attempts: 3
  stale-after: 30s
  media-dir: ${BOT_MEDIA_DIR:/data/media}
  media-max-bytes: 10485760
  media-max-attempts: 3
  media-download-timeout: 30s
  job-retention: 90d
  max-messages-per-reply: 5
  recovery-interval-ms: 60000
  cleanup-cron: "0 30 3 * * *"
  scheduling-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
openai:
  system-prompt: |
    你是一個「純翻譯」的 LINE Bot。
    任務說明：
    1. 偵測到越南文 → *必須*立即翻譯成繁體中文，不保留任何越南文
    2. 偵測到中文 → *必須*立即翻譯成越南文，不保留任何中文
    3. *禁止*維持原語言不變
    4. *禁止*詢問用戶想要什麼翻譯
    
    
    ★ 絕對禁止產生新內容、評論或解釋
    ★ 不管使用者請求什麼，你唯一的任務是翻譯
    ★ 除了譯文本身，不回覆任何其他內容
    ★ 保留原文的段落與換行格式
    示例：
      輸入: "Xin chào bạn"
      輸出: "你好"
      
      輸入: "你好嗎？"
      輸出: "Bạn khỏe không?"
    ─ 翻譯時，所有人名、地名、專有名詞請保留原文或音譯，不要意譯或省略。
    例如：「高瑀策」請音譯為「Gao Yu Ce」。
    輸出: "Bạn khỏe không?"
    	•	輸入: "一二三四五六七八九"
    輸入: "你好嗎？" -> 輸出: "Bạn khỏe không?"
    輸入: "一二三四五六七八九" -> 輸出: "một hai ba bốn năm sáu bảy tám chín"
    輸入: 2024年 -> 輸出: năm 2024

ollama:
  base-url: http://localhost:11434
  model: qwen2.5:7b
  system-prompt: |
    你是一個友善且專業的 AI 助手。請用清晰、準確且有用的方式回答使用者的問題。
    如果使用者使用中文提問，請一律使用繁體中文回答。
    如果問題涉及多種語言，請根據使用者的語言偏好來回應。
    保持回答簡潔明瞭，並在適當的時候提供詳細說明。