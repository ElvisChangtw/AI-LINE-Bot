line:
  bot:
    channel-token: ${LINE_CHANNEL_TOKEN}
    channel-secret: ${LINE_CHANNEL_SECRET}
    connect-timeout: 5s
    read-timeout: 15s

server:
  shutdown: graceful

# 2) Spring AI / OpenAI
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:sqlite:${BOT_DB_PATH:/data/app.db}?journal_mode=WAL
    hikari:
      maximum-pool-size: 1
  flyway:
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      model:
        audio:
          transcription: openai
      http:
        connect-timeout: 100s
        read-timeout: 120s
      image:
        options:
          model: dall-e-3
          size: 1024x1024
          quality: standard
    retry:
      max-attempts: 1
      backoff:
        initial-interval: 2s
bot:
  reply-deadline: 45s
  reply-timeout: 15s
  material-ttl: 7d
  waiting-ttl: 24h
  recent-window: 10m
  job-lease: 5m
  job-max-attempts: 3
  stale-after: 30s
  media-dir: ${BOT_MEDIA_DIR:/data/media}
  media-max-bytes: 10485760
  media-max-attempts: 3
  media-download-timeout: 30s
  job-retention: 90d
  max-messages-per-reply: 5
  recovery-interval-ms: 60000
  cleanup-cron: "0 30 3 * * *"
  scheduling-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
factcheck:
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY}
  model: gpt-6-luna
  reasoning-effort: medium
  max-tool-calls: 3
  request-timeout: 40s
  input-micro-usd-per-million: 100000
  output-micro-usd-per-million: 500000
  search-micro-usd-per-call: 10000
  daily-limit-micro-usd: 2000000
  monthly-limit-micro-usd: 40000000
  cache-ttl: 24h
  prompt-version: v2
